<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Presupuesto - Control-Pro</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 30px; color: #f8fafc; display: flex; justify-content: center; }
        .contenedor { width: 100%; max-width: 800px; background: #1e293b; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-top: 4px solid #38bdf8; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 22px; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        form { display: flex; flex-direction: column; gap: 18px; }
        
        p, .form-group { display: flex; flex-direction: column; gap: 8px; margin: 0; }
        label { font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, select { background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        
        .botones { display: flex; gap: 15px; margin-top: 20px; }
        .btn-guardar { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-guardar:hover { background: linear-gradient(135deg, #0369a1, #075985); transform: translateY(-2px); }
        .btn-cancelar { background: #334155; color: #cbd5e1; text-decoration: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; text-align: center; flex: 1; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-cancelar:hover { background: #475569; color: white; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>
            <button type="submit" class="btn-verde">Crear Nuevo Presupuesto</button>
        </h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <!-- Si usas Inline Formsets para los ítems del presupuesto, inclúyelos aquí: -->
            {{ inline_formset.as_p }}
            
            <div class="botones">
                <button type="submit" class="btn-guardar">
                    <i class="fas fa-save"></i> Guardar Presupuesto
                </button>
                <a href="/presupuestos/" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
