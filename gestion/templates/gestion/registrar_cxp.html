<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA TECHNOLOGY - Registrar Cuenta por Pagar</title>
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 30px; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .contenedor { background-color: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 100%; max-width: 600px; border-top: 4px solid #38bdf8; }
        h2 { color: #38bdf8; margin-top: 0; margin-bottom: 25px; font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 13px; font-weight: 600; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        .btn-guardar { background: linear-gradient(135deg, #22c55e, #15803d); color: white; padding: 14px; border: none; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s; margin-top: 10px; text-transform: uppercase; }
        .btn-guardar:hover { background: linear-gradient(135deg, #4ade80, #16a34a); transform: translateY(-2px); }
        .btn-volver { display: inline-block; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; text-align: center; }
        .btn-volver:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>💳 Registrar Nueva Cuenta por Pagar</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-guardar">Guardar Cuenta por Pagar</button>
        </form>
        <a href="/cuentas-por-pagar/" class="btn-volver">← Volver al listado</a>
    </div>

</body>
</html>
