<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA TECHNOLOGY - Gestión de Usuarios</title>
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 30px; color: #f8fafc; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #1e293b; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header h2 { margin: 0; color: #38bdf8; font-size: 24px; }
        .btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; transition: all 0.2s; display: inline-block; border: none; cursor: pointer; }
        .btn:hover { background: linear-gradient(135deg, #38bdf8, #0284c7); transform: translateY(-2px); }
        .btn-volver { background: #475569; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        tr:hover { background-color: #334155; }
        .footer-acciones { text-align: right; margin-top: 30px; margin-bottom: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>👥 Control de Usuarios y Niveles</h2>
            <div>
                <a href="index.html" class="btn btn-volver">🔙 Volver al Menú</a>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Correo Electrónico</th>
                        <th>Nivel / Permisos</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="font-weight: bold; color: #38bdf8;">admin</td>
                        <td>admin@tiendatechnology.com</td>
                        <td><span style="color: #22c55e; font-weight: bold;">Administrador Total</span></td>
                        <td><span style="color: #22c55e;">Activo</span></td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold; color: #38bdf8;">tecnico1</td>
                        <td>tecnico@tiendatechnology.com</td>
                        <td><span style="color: #94a3b8;">Técnico / Estándar</span></td>
                        <td><span style="color: #22c55e;">Activo</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer-acciones">
            <a href="index.html" class="btn btn-volver" style="padding: 12px 30px; font-size: 16px;">🔙 Volver al Menú</a>
        </div>
    </div>
</body>
</html>
