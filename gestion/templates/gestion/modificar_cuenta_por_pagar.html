<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA TECHNOLOGY - Modificar Cuenta por Pagar</title>
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 30px; color: #f8fafc; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        form p { margin-bottom: 20px; }
        form label { display: block; color: #94a3b8; font-weight: 600; margin-bottom: 8px; font-size: 14px; text-transform: uppercase; }
        form input, form select, form textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
        form input:focus, form select:focus, form textarea:focus { outline: none; border-color: #38bdf8; }
        .btn-container { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: linear-gradient(135deg, #38bdf8, #0284c7); transform: translateY(-2px); }
        .btn-volver { background: #475569; }
        .btn-volver:hover { background: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✏️ Modificar Cuenta por Pagar</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="btn-container">
                <a href="{% url 'cuentas_por_pagar' %}" class="btn btn-volver">⬅️ Cancelar</a>
                <button type="submit" class="btn">💾 Guardar Cambios</button>
            </div>
        </form>
    </div>
</body>
</html>
