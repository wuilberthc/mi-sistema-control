<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - Control-Pro</title>
    <!-- Bootstrap 5 CSS y FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 30px; color: #f8fafc; display: flex; justify-content: center; }
        .contenedor { width: 100%; max-width: 650px; background: #1e293b; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-top: 4px solid #38bdf8; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 22px; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, select { background: #0f172a !important; border: 1px solid #334155 !important; color: #f8fafc !important; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { border-color: #38bdf8 !important; outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .botones { display: flex; gap: 15px; margin-top: 20px; }
        .btn-guardar { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; transition: all 0.2s; }
        .btn-guardar:hover { background: linear-gradient(135deg, #0369a1, #075985); transform: translateY(-2px); }
        .btn-cancelar { background: #334155; color: #cbd5e1; text-decoration: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; text-align: center; flex: 1; transition: all 0.2s; display: inline-block; }
        .btn-cancelar:hover { background: #475569; color: white; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>📦 Registrar Nuevo Producto</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Renderizado de campos del formulario con integración de botón modal para proveedor -->
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {% if field.name == 'proveedor' %}
                        <div class="input-group">
                            {{ field }}
                            <button type="button" class="btn btn-outline-info" data-bs-toggle="modal" data-bs-target="#modalProveedor" title="Agregar nuevo proveedor">
                                <i class="fas fa-plus"></i> Nuevo
                            </button>
                        </div>
                    {% else %}
                        {{ field }}
                    {% endif %}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="botones">
                <button type="submit" class="btn-guardar">Guardar Producto</button>
                <a href="/productos/" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Modal de Bootstrap para Registrar Proveedor al Instante -->
    <div class="modal fade" id="modalProveedor" tabindex="-1" aria-labelledby="modalProveedorLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form method="POST" action="{% url 'crear_proveedor_modal' %}">
                {% csrf_token %}
                <div class="modal-content" style="background: #1e293b; color: #f8fafc; border: 1px solid #334155;">
                    <div class="modal-header" style="border-bottom: 1px solid #334155;">
                        <h5 class="modal-title" id="modalProveedorLabel" style="color: #38bdf8;">Registrar Nuevo Proveedor</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Proveedor</label>
                            <input type="text" name="nombre" class="form-control" required placeholder="Ej. Mayorista C.A.">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" placeholder="Ej. 0414-1234567">
                        </div>
                    </div>
                    <div class="modal-footer" style="border-top: 1px solid #334155;">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" style="background: #0284c7; border: none;">Guardar Proveedor</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
